# ================================================================
#  注册中心 + 配置中心（Nacos）
#  Service Registry & Config Center (Nacos)
# ================================================================

spring:
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848                    # Nacos 服务器地址 / Nacos server address
      username: nacos                                # Nacos 账号 / Nacos username
      password: nacos                                # Nacos 密码 / Nacos password
      discovery:                                     # 服务发现配置 / Service discovery config
        enabled: false                               # 禁用服务发现客户端
        register-enabled: false                      # 禁止服务注册
        namespace: dev                               # 命名空间（dev 开发环境） / Namespace (dev)
        group: DEFAULT_GROUP                         # 分组 / Group
        metadata:
          version: 1.0.0                             # 服务版本号（用于灰度发布） / Service version (for gray release)
      config:                                        # 配置中心配置 / Config center config
        namespace: dev                               # 命名空间（dev 开发环境） / Namespace (dev)
        group: DEFAULT_GROUP                         # 分组 / Group

  # ================================================================
  #  数据库相关配置
  #  Database Configuration
  # ================================================================

  autoconfigure:
    exclude:                                         # 自动配置排除项 / Auto-configuration exclusions

  # Druid 数据源配置 / Druid datasource configuration
  datasource:
    druid:                                           # Druid 监控配置 / Druid monitoring config
      web-stat-filter:
        enabled: true
      stat-view-servlet:
        enabled: true
        allow:                                       # 白名单（不填则允许所有访问） / Allow list (empty = allow all)
        url-pattern: /druid/*
        login-username:                              # 控制台用户名 / Console username
        login-password:                              # 控制台密码 / Console password
      filter:
        stat:
          enabled: true
          log-slow-sql: true                         # 记录慢 SQL / Log slow SQL
          slow-sql-millis: 100                       # 慢 SQL 阈值（毫秒） / Slow SQL threshold (ms)
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true              # 允许多语句 / Allow multi-statement

    # 多数据源配置 / Multi-datasource configuration
    dynamic:
      druid:                                         # Druid 连接池全局配置 / Druid connection pool global config
        initial-size: 1                              # 初始连接数 / Initial connections
        min-idle: 1                                  # 最小空闲连接数 / Minimum idle connections
        max-active: 20                               # 最大活动连接数 / Maximum active connections
        max-wait: 60000                              # 获取连接超时时间（毫秒） / Connection acquisition timeout (ms)
        time-between-eviction-runs-millis: 60000     # 空闲连接检测间隔（毫秒） / Idle connection check interval (ms)
        min-evictable-idle-time-millis: 600000       # 最小空闲存活时间（毫秒） / Minimum idle time before eviction (ms)
        max-evictable-idle-time-millis: 1800000      # 最大空闲存活时间（毫秒） / Maximum idle time before eviction (ms)
        validation-query: SELECT 1 FROM DUAL         # 连接校验 SQL / Validation query
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
        pool-prepared-statements: true               # 启用 PreparedStatement 缓存 / Enable PreparedStatement cache
        max-pool-prepared-statement-per-connection-size: 20  # 每个连接缓存最大数量 / Max cached statements per connection

      primary: master                                # 主数据源 / Primary datasource
      datasource:
        master:                                      # 主库配置 / Master database
          url: jdbc:mysql://127.0.0.1:3306/database?useSSL=true&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
          # MySQL Connector/J 5.X 示例（已注释） / MySQL Connector/J 5.X example (commented)
          # url: jdbc:mysql://127.0.0.1:3306/ruoyi-vue-pro?useSSL=true&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
          # PostgreSQL 示例（已注释） / PostgreSQL example (commented)
          # url: jdbc:postgresql://127.0.0.1:5432/ruoyi-vue-pro
          # Oracle 示例（已注释） / Oracle example (commented)
          # url: jdbc:oracle:thin:@127.0.0.1:1521:xe
          # SQL Server 示例（已注释） / SQL Server example (commented)
          # url: jdbc:sqlserver://127.0.0.1:1433;DatabaseName=ruoyi-vue-pro
          # 达梦数据库示例（已注释） / Dameng DB example (commented)
          # url: jdbc:dm://10.211.55.4:5236?schema=RUOYI_VUE_PRO
          username: root
          password: root
          # SQL Server 示例凭证（已注释） / SQL Server credentials (commented)
          # username: sa
          # password: JSm:g(*%lU4ZAkz06cd52KqT3)i1?H7W
          # 达梦数据库凭证（已注释） / Dameng DB credentials (commented)
          # username: SYSDBA
          # password: SYSDBA
        # 从库配置（模拟，已注释） / Slave database (simulated, commented)
        # slave:
        #   lazy: true                               # 开启懒加载，加快启动速度 / Lazy initialization
        #   url: jdbc:mysql://127.0.0.1:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&rewriteBatchedStatements=true
        #   username: root
        #   password: 123456

  # Redis 配置（Redisson 默认配置已足够，一般无需调优）
  # Redis configuration (Redisson defaults are sufficient, no tuning needed)
  data:
    redis:
      host: 192.168.2.193                            # Redis 主机地址 / Redis host
      # host: 127.0.0.1                              # 备选地址（已注释） / Alternative host (commented)
      port: 6379                                     # Redis 端口 / Redis port
      database: 0                                    # 数据库索引 / Database index
      # password: 123456                             # 密码（建议生产环境开启） / Password (recommended for production)

  # RabbitMQ 配置 / RabbitMQ configuration
  rabbitmq:
    host: 127.0.0.1                                  # RabbitMQ 服务地址 / RabbitMQ host
    port: 5672                                       # RabbitMQ 服务端口 / RabbitMQ port
    username: guest                                  # RabbitMQ 账号 / RabbitMQ username
    password: guest                                  # RabbitMQ 密码 / RabbitMQ password

  # Kafka 配置 / Kafka configuration
  kafka:
    bootstrap-servers: 127.0.0.1:9092                # Kafka Broker 地址（可多个，逗号分隔） / Kafka broker addresses

  # Spring Boot Admin 配置 / Spring Boot Admin configuration
  boot:
    admin:
      client:                                        # Admin Client 配置 / Admin Client config
        instance:
          service-host-type: IP                      # 注册时优先使用 IP / Prefer IP over hostname
        username: admin
        password: admin

# ================================================================
#  MQ 消息队列相关配置（RocketMQ 独立）
#  Message Queue Configuration (RocketMQ standalone)
# ================================================================

rocketmq:
  name-server: 127.0.0.1:9876                        # RocketMQ Namesrv 地址 / Namesrv address

# ================================================================
#  定时任务（XXL-JOB）配置
#  Distributed Job Scheduling (XXL-JOB)
# ================================================================

xxl:
  job:
    enabled: false                                   # 是否启用调度中心（默认 true） / Enable scheduler (default: true)
    admin:
      addresses: http://127.0.0.1:9090/xxl-job-admin  # 调度中心地址 / Scheduler admin address

# ================================================================
#  服务保障（分布式锁等）配置
#  Service Protection (Distributed Lock, etc.)
# ================================================================

# Lock4j 分布式锁配置 / Lock4j distributed lock configuration
lock4j:
  acquire-timeout: 3000                              # 获取锁超时时间（毫秒） / Lock acquisition timeout (ms)
  expire: 30000                                     # 锁持有时间（毫秒） / Lock expiration time (ms)

# ================================================================
#  监控相关配置
#  Monitoring Configuration
# ================================================================

# Actuator 监控端点配置 / Actuator monitoring endpoints
management:
  endpoints:
    web:
      base-path: /actuator                           # Actuator API 根路径 / Actuator base path
      exposure:
        include: '*'                                 # 开放所有端点（默认仅 health 和 info） / Expose all endpoints

# ================================================================
#  日志配置
#  Logging Configuration
# ================================================================

logging:
  level:
    # MyBatis Mapper 日志级别（调试用） / MyBatis Mapper log level (for debugging)
    cn.realm.cloud.module.system.dal.mysql: debug
    cn.realm.cloud.module.system.dal.mysql.sms.SmsChannelMapper: INFO  # 降低特定 Mapper 日志级别 / Reduce log level for specific mapper
    # Spring Boot 3.X 存在部分 WARN 提示，暂时降级为 ERROR / Suppress some WARN logs in Spring Boot 3.X
    org.springframework.context.support.PostProcessorRegistrationDelegate: ERROR

