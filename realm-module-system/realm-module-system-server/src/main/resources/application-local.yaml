# ================================================================
#  项目自定义配置（Realm 框架）
#  Project Custom Configuration (Realm Framework)
# ================================================================

realm:
  env:                                               # 多环境配置 / Multi-environment config
    tag: ${HOSTNAME}                                 # 环境标签（使用主机名） / Environment tag (using hostname)
  captcha:
    enable: false                                    # 本地环境暂时关闭图片验证码 / Disable captcha in local environment
  security:
    mock-enable: true                                # 启用 Mock 认证 / Enable mock authentication
  access-log:
    enable: true                                     # 启用访问日志 / Enable access log
  wxa-code:
    env-version: develop                             # 小程序版本：develop 开发版 / trial 体验版 / release 正式版
    # Mini program version: develop / trial / release
  wxa-subscribe-message:
    miniprogram-state: developer                     # 跳转小程序类型：developer 开发版 / trial 体验版 / formal 正式版
    # Mini program jump type: developer / trial / formal

