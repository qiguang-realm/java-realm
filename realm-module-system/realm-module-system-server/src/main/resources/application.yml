# ================================================================
#  Spring Boot 应用核心配置
# ================================================================

spring:
  application:
    name: system-server                           # 应用名称 / Application name

  profiles:
    active: local                                 # 当前激活的配置文件 / Active profile

  main:
    allow-circular-references: true               # 允许循环依赖（三层架构不可避免） / Allow circular references
    allow-bean-definition-overriding: true        # 允许 Bean 覆盖（如 Feign 重复定义） / Allow bean overriding

  config:
    import:
      - optional:classpath:application-${spring.profiles.active}.yaml   # 加载本地配置 / Load local profile config
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml  # 加载 Nacos 配置 / Load Nacos config

  # Servlet 文件上传配置 / Servlet multipart configuration
  servlet:
    multipart:
      max-file-size: 16MB                         # 单个文件最大大小 / Max file size
      max-request-size: 32MB                      # 总请求大小限制 / Max request size

  # Jackson 序列化配置 / Jackson serialization
  jackson:
    serialization:
      write-dates-as-timestamps: true             # LocalDateTime 使用时间戳 / Use timestamps for LocalDateTime
      write-date-timestamps-as-nanoseconds: false # 不使用纳秒级时间戳 / Disable nanosecond timestamps
      write-durations-as-timestamps: true         # Duration 使用时间戳 / Use timestamps for Duration
      fail-on-empty-beans: false                  # 允许序列化无属性的 Bean / Allow serializing empty beans

  # 缓存配置（Redis） / Cache configuration (Redis)
  cache:
    type: REDIS
    redis:
      time-to-live: 1h                            # 缓存过期时间 1 小时 / TTL 1 hour

  # Spring Data Redis 配置 / Spring Data Redis
  data:
    redis:
      repositories:
        enabled: false                            # 未使用 Repository，禁用加快启动 / Disable to speed up startup

  # Kafka 配置（消息队列） / Kafka configuration (Message Queue)
  kafka:
    producer:
      acks: 1                                     # 0-不应答，1-leader 应答，all-全部应答 / Acks mode
      retries: 3                                  # 重试次数 / Retry count
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      auto-offset-reset: earliest                 # 消费偏移重置策略 / Offset reset policy
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: '*'
    listener:
      missing-topics-fatal: false                 # 主题不存在不报错 / Do not fail on missing topics

# ================================================================
#  Web 服务器配置
# ================================================================
server:
  port: 48081                                     # 服务端口 / Server port

# ================================================================
#  日志配置
# ================================================================
logging:
  file:
    name: ${user.home}/logs/${spring.application.name}.log   # 日志文件路径 / Log file path

# ================================================================
#  接口文档配置（SpringDoc + Knife4j）
# ================================================================
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui
  default-flat-param-object: true                 # 参见 Knife4j 文档 / See Knife4j docs

knife4j:
  enable: true
  setting:
    language: zh_cn                               # 界面语言 / UI language

# ================================================================
#  MyBatis-Plus 配置
# ================================================================
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true            # 下划线转驼峰 / Enable underscore-to-camel mapping
  global-config:
    db-config:
      id-type: NONE                               # “智能”模式，根据数据源自动适配 AUTO/INPUT / Smart mode
      logic-delete-value: 1                       # 逻辑已删除值 / Deleted value
      logic-not-delete-value: 0                   # 逻辑未删除值 / Not deleted value
    banner: false                                 # 关闭 Banner / Disable banner
  type-aliases-package: ${realm.info.base-package}.dal.dataobject
  encryptor:
    password: XDV71a+xqStEA3WH                    # AES 加密密钥 / AES encryption key (可在线生成)

mybatis-plus-join:
  banner: false                                   # 关闭 Banner / Disable banner

# ================================================================
#  数据翻译（Easy-Trans）
# ================================================================
easy-trans:
  is-enable-global: false                         # 关闭全局翻译（性能考虑） / Disable global translation for performance

# ================================================================
#  RocketMQ 配置（消息队列）
# ================================================================
rocketmq:
  producer:
    group: ${spring.application.name}_PRODUCER    # 生产者分组 / Producer group

# ================================================================
#  XXL-JOB 分布式任务调度配置
# ================================================================
xxl:
  job:
    executor:
      appname: ${spring.application.name}         # 执行器 AppName / Executor app name
      logpath: ${user.home}/logs/xxl-job/${spring.application.name}   # 日志路径 / Log path
    accessToken: default_token                    # 通讯 Token / Access token

# ================================================================
#  验证码（Anji Captcha）配置
# ================================================================
aj:
  captcha:
    jigsaw: classpath:images/jigsaw               # 滑块拼图底图路径 / Jigsaw image path
    pic-click: classpath:images/pic-click         # 点击验证底图路径 / Click image path
    cache-type: redis                             # 缓存类型 / Cache type (local/redis)
    cache-number: 1000                            # local 缓存阈值 / Local cache threshold
    timing-clear: 180                             # local 缓存清理间隔（秒） / Local cache clear interval (seconds)
    type: blockPuzzle                             # 验证码类型：blockPuzzle 滑块 / clickWord 文字点选 / pictureWord 文本输入
    water-mark: qi guang                          # 水印文字（中文需 Unicode） / Watermark text
    interference-options: 0                       # 干扰项级别 / Interference level
    req-frequency-limit-enable: false             # 是否开启请求频率限制 / Enable request frequency limit
    req-get-lock-limit: 5                         # 获取验证码失败锁定次数 / Lock after fail count
    req-get-lock-seconds: 10                      # 锁定时间（秒） / Lock duration (seconds)
    req-get-minute-limit: 30                      # get 接口每分钟限制 / Get requests per minute limit
    req-check-minute-limit: 60                    # check 接口每分钟限制 / Check requests per minute limit
    req-verify-minute-limit: 60                   # verify 接口每分钟限制 / Verify requests per minute limit

# ================================================================
#  项目自定义配置（realm.*）
# ================================================================
realm:
  info:
    version: 1.0.0
    base-package: cn.realm.cloud.module.system   # 业务模块基础包 / Base package of business modules
  web:
    admin-ui:
      url: http://dashboard.realm.cn       # 管理后台 UI 地址 / Admin UI URL
  xss:
    enable: false                                  # 是否开启 XSS 过滤 / Enable XSS filter
    exclude-urls:
      - ${management.endpoints.web.base-path}/**   # 排除 Actuator 端点 / Exclude actuator endpoints
  api-encrypt:
    enable: true                                   # 是否开启 API 加密 / Enable API encryption
    algorithm: AES                                 # 加密算法（AES/RSA） / Encryption algorithm
    request-key: 52549111389893486934626385991395  # AES 请求加密密钥（16/24/32位） / AES request key (16/24/32 chars)
    response-key: 96103715984234343991809655248883 # AES 响应加密密钥 / AES response key
    # 以下为 RSA 示例（已注释） / RSA examples (commented out)
    # request-key: 
    # response-key: MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQDh/CHyBcS/zEfVyINVA7+c9Xxl0CPdxPMK1OIjxaLy/7BLfbkoEpI8onQtjuzfpuxCraDem9bu3BMF0pMH95HytI3Vi0kGjaV+WLIalwgc2w37oA2sbsmKzQOP7SDLO5s2QJNAD7kVwd+Q5rqaLu2MO0xVv+0IUJhn83hClC0L5wIDAQAB
  swagger:
    title: 管理后台
    description: 提供管理员管理的所有功能
    version: ${realm.info.version}
  tenant:
    enable: true                                   # 是否启用多租户 / Enable multi-tenancy
    ignore-urls: []                                # 忽略租户的 URL（可配置） / Ignore tenant URLs
    ignore-visit-urls:
      - /admin-api/system/user/profile/**
      - /admin-api/system/auth/**
    ignore-tables: []                              # 忽略租户过滤的表 / Ignore tenant tables
    ignore-caches:
      - user_role_ids
      - permission_menu_ids
      - oauth_client
      - notify_template
      - mail_account
      - mail_template
      - sms_template
  sms-code:
    expire-times: 10m                              # 验证码过期时间 / Expiration time
    send-frequency: 1m                             # 发送频率限制 / Send frequency
    send-maximum-quantity-per-day: 10              # 每日发送上限 / Daily send limit
    begin-code: 9999                               # 测试用验证码范围开始 / Test code start (for testing)
    end-code: 9999                                 # 测试用验证码范围结束 / Test code end

# ================================================================
#  调试模式
# ================================================================
debug: false
