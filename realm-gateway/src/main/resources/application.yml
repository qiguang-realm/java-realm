# ================================================================
#  Gateway 服务配置（application.yml）
#  Gateway Service Configuration
#  包含应用信息、Spring Cloud Gateway 路由、Knife4j 文档聚合等
# ================================================================

# ================================================================
#  应用基本信息
# ================================================================

spring:
  application:
    name: gateway-server                             # 应用名称 / Application name

  profiles:
    active: local                                    # 激活的环境 / Active profile

  http:
    codecs:
      max-in-memory-size: 10MB                       # 调整缓冲区大小 / Max in-memory size

  # -------- Jackson 序列化配置 --------
  jackson:
    serialization:
      write-dates-as-timestamps: true                # LocalDateTime 使用时间戳 / Use timestamps
      write-date-timestamps-as-nanoseconds: false    # 不使用纳秒级时间戳 / Disable nanosecond timestamps
      write-durations-as-timestamps: true            # Duration 使用时间戳 / Use timestamps for Duration
      fail-on-empty-beans: false                     # 允许序列化无属性的 Bean / Allow empty beans

  main:
    allow-circular-references: true                  # 允许循环依赖（三层架构无法避免） / Allow circular references

  # -------- 配置导入（本地 + Nacos） --------
  config:
    import:
      - optional:classpath:application-${spring.profiles.active}.yaml   # 加载本地配置 / Load local profile config
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml  # 加载 Nacos 配置 / Load Nacos config

  # -------- Spring Cloud Gateway 配置 --------
  cloud:
    gateway:
      server:
        webflux:
          # 路由配置项（按服务分组） / Route definitions (grouped by service)
          routes:
            ## ============ system-server ============
            - id: system-admin-api                   # 路由 ID / Route ID
              uri: grayLb://system-server
              predicates:
                - Path=/admin-api/system/**
              filters:
                - RewritePath=/admin-api/system/v3/api-docs, /v3/api-docs
            - id: system-app-api
              uri: grayLb://system-server
              predicates:
                - Path=/app-api/system/**
              filters:
                - RewritePath=/app-api/system/v3/api-docs, /v3/api-docs

            ## ============ infra-server ============
            - id: infra-admin-api
              uri: grayLb://infra-server
              predicates:
                - Path=/admin-api/infra/**
              filters:
                - RewritePath=/admin-api/infra/v3/api-docs, /v3/api-docs
            - id: infra-app-api
              uri: grayLb://infra-server
              predicates:
                - Path=/app-api/infra/**
              filters:
                - RewritePath=/app-api/infra/v3/api-docs, /v3/api-docs
            - id: infra-spring-boot-admin            # Spring Boot Admin 路由
              uri: grayLb://infra-server
              predicates:
                - Path=/admin/**
            - id: infra-websocket                    # WebSocket 路由
              uri: grayLb://infra-server
              predicates:
                - Path=/infra/ws/**

            ## ============ member-server ============
            - id: member-admin-api
              uri: grayLb://member-server
              predicates:
                - Path=/admin-api/member/**
              filters:
                - RewritePath=/admin-api/member/v3/api-docs, /v3/api-docs
            - id: member-app-api
              uri: grayLb://member-server
              predicates:
                - Path=/app-api/member/**
              filters:
                - RewritePath=/app-api/member/v3/api-docs, /v3/api-docs

            ## ============ bpm-server ============
            - id: bpm-admin-api
              uri: grayLb://bpm-server
              predicates:
                - Path=/admin-api/bpm/**
              filters:
                - RewritePath=/admin-api/bpm/v3/api-docs, /v3/api-docs

            ## ============ report-server ============
            - id: report-admin-api
              uri: grayLb://report-server
              predicates:
                - Path=/admin-api/report/**
              filters:
                - RewritePath=/admin-api/report/v3/api-docs, /v3/api-docs
            - id: report-jimu                        # 积木报表路由 / JimuReport routes
              uri: grayLb://report-server
              predicates:
                - Path=/jmreport/**, /drag/**, /jimubi/**

            ## ============ pay-server ============
            - id: pay-admin-api
              uri: grayLb://pay-server
              predicates:
                - Path=/admin-api/pay/**
              filters:
                - RewritePath=/admin-api/pay/v3/api-docs, /v3/api-docs
            - id: pay-app-api
              uri: grayLb://pay-server
              predicates:
                - Path=/app-api/pay/**
              filters:
                - RewritePath=/app-api/pay/v3/api-docs, /v3/api-docs

            ## ============ mp-server ============
            - id: mp-admin-api
              uri: grayLb://mp-server
              predicates:
                - Path=/admin-api/mp/**
              filters:
                - RewritePath=/admin-api/mp/v3/api-docs, /v3/api-docs

            ## ============ product-server ============
            - id: product-admin-api
              uri: grayLb://product-server
              predicates:
                - Path=/admin-api/product/**
              filters:
                - RewritePath=/admin-api/product/v3/api-docs, /v3/api-docs
            - id: product-app-api
              uri: grayLb://product-server
              predicates:
                - Path=/app-api/product/**
              filters:
                - RewritePath=/app-api/product/v3/api-docs, /v3/api-docs

            ## ============ promotion-server ============
            - id: promotion-admin-api
              uri: grayLb://promotion-server
              predicates:
                - Path=/admin-api/promotion/**
              filters:
                - RewritePath=/admin-api/promotion/v3/api-docs, /v3/api-docs
            - id: promotion-app-api
              uri: grayLb://promotion-server
              predicates:
                - Path=/app-api/promotion/**
              filters:
                - RewritePath=/app-api/promotion/v3/api-docs, /v3/api-docs

            ## ============ trade-server ============
            - id: trade-admin-api
              uri: grayLb://trade-server
              predicates:
                - Path=/admin-api/trade/**
              filters:
                - RewritePath=/admin-api/trade/v3/api-docs, /v3/api-docs
            - id: trade-app-api
              uri: grayLb://trade-server
              predicates:
                - Path=/app-api/trade/**
              filters:
                - RewritePath=/app-api/trade/v3/api-docs, /v3/api-docs

            ## ============ statistics-server ============
            - id: statistics-admin-api
              uri: grayLb://statistics-server
              predicates:
                - Path=/admin-api/statistics/**
              filters:
                - RewritePath=/admin-api/statistics/v3/api-docs, /v3/api-docs

            ## ============ erp-server ============
            - id: erp-admin-api
              uri: grayLb://erp-server
              predicates:
                - Path=/admin-api/erp/**
              filters:
                - RewritePath=/admin-api/erp/v3/api-docs, /v3/api-docs

            ## ============ crm-server ============
            - id: crm-admin-api
              uri: grayLb://crm-server
              predicates:
                - Path=/admin-api/crm/**
              filters:
                - RewritePath=/admin-api/crm/v3/api-docs, /v3/api-docs

            ## ============ ai-server ============
            - id: ai-admin-api
              uri: grayLb://ai-server
              predicates:
                - Path=/admin-api/ai/**
              filters:
                - RewritePath=/admin-api/ai/v3/api-docs, /v3/api-docs
            - id: ai-mcp-server                        # MCP Server 路由
              uri: grayLb://ai-server
              predicates:
                - Path=/sse, /mcp/message

            ## ============ iot-server ============
            - id: iot-admin-api
              uri: grayLb://iot-server
              predicates:
                - Path=/admin-api/iot/**
              filters:
                - RewritePath=/admin-api/iot/v3/api-docs, /v3/api-docs

          # 转发前缀配置（避免 Swagger 重复前缀） / X-Forwarded prefix config
          x-forwarded:
            prefix-enabled: false

          # 默认过滤器（处理响应头重复） / Default filters (dedupe response headers)
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

# ================================================================
#  服务器端口
# ================================================================
server:
  port: 48080

# ================================================================
#  日志配置
# ================================================================
logging:
  file:
    name: ${user.home}/logs/${spring.application.name}.log   # 日志文件路径 / Log file path

# ================================================================
#  Knife4j 文档聚合配置
#  参考：https://doc.xiaominfo.com/docs/action/springcloud-gateway
# ================================================================
knife4j:
  gateway:
    enabled: true
    routes:
      - name: system-server
        service-name: system-server
        url: /admin-api/system/v3/api-docs
      - name: infra-server
        service-name: infra-server
        url: /admin-api/infra/v3/api-docs
      - name: member-server
        service-name: member-server
        url: /admin-api/member/v3/api-docs
      - name: bpm-server
        service-name: bpm-server
        url: /admin-api/bpm/v3/api-docs
      - name: pay-server
        service-name: pay-server
        url: /admin-api/pay/v3/api-docs
      - name: mp-server
        service-name: mp-server
        url: /admin-api/mp/v3/api-docs
      - name: product-server
        service-name: product-server
        url: /admin-api/product/v3/api-docs
      - name: promotion-server
        service-name: promotion-server
        url: /admin-api/promotion/v3/api-docs
      - name: trade-server
        service-name: trade-server
        url: /admin-api/trade/v3/api-docs
      - name: statistics-server
        service-name: statistics-server
        url: /admin-api/statistics/v3/api-docs
      - name: erp-server
        service-name: erp-server
        url: /admin-api/erp/v3/api-docs
      - name: crm-server
        service-name: crm-server
        url: /admin-api/crm/v3/api-docs
      - name: ai-server
        service-name: ai-server
        url: /admin-api/ai/v3/api-docs
      - name: iot-server
        service-name: iot-server
        url: /admin-api/iot/v3/api-docs

# ================================================================
#  （Realm）自定义配置
# ================================================================

realm:
  info:
    version: 1.0.0
